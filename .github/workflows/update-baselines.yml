name: Update visual baselines

# Visual baselines are rendered per platform. CI runs on Linux, so its
# baselines must be generated on Linux: run this workflow by hand, download
# the artifact, and commit the PNGs to e2e/visual.spec.ts-snapshots/.
on:
  workflow_dispatch:

jobs:
  baselines:
    # Pinned, not ubuntu-latest: visual baselines depend on the OS font
    # rendering, so the runner image changes only when we choose.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium

      - name: Render baselines
        run: npx playwright test e2e/visual.spec.ts --update-snapshots
        env:
          UPDATE_BASELINES: '1'

      - uses: actions/upload-artifact@v7
        with:
          name: linux-visual-baselines
          path: e2e/visual.spec.ts-snapshots/*-linux.png
